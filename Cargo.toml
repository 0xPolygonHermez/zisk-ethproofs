[package]
name = "ethproofs-client"
version = "0.10.0"
edition = "2021"
description = ""

[dependencies]
alloy-provider = { version = "1.7.3", default-features = false, features = [
    "reqwest",
    "reqwest-rustls-tls",
] }
anyhow = "1.0.97"
base64 = "0.22.1"
bincode = { version = "2.0", default-features = false, features = ["serde", "std"] }
chrono = "0.4"
clap = { version = "4.5.21", features = ["derive"] }
dotenv = "0.15.0"
ethers = { version = "2.0.14", features = ["ws"] }
env_logger = "0.11.5"
flate2 = "1.0.0"
futures-util = "0.3"
log = "0.4.26"
rand = "0.9.0"
reqwest = { version = "0.12.15", features = ["json"] }
tar = "0.4.44"
tokio = { version = "1.44.0", features = ["full"] }
tokio-tungstenite = "0.21"
url = "2.5.4"
input = { git = "https://github.com/0xPolygonHermez/zisk-eth-client.git", branch = "fix/ziskethone-macos", features = ["cli", "reth", "ethrex", "ziskethone"] }
# input = { path = "../zisk-eth-client/crates/input", features = ["cli", "reth", "ethrex", "ziskethone"] }

lazy_static = "1.4"
axum = { version = "0.7", features = ["macros", "json"] }
bytemuck = "1.24.0"
prometheus = "0.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio", "macros", "tls-rustls"] }
tonic = "0.14"
zstd = "0.13.3"
regex = "1.12.2"

zisk-sdk = { git = "https://github.com/0xPolygonHermez/zisk.git", branch = "pre-develop-1.3.0-alpha" }
# crates.io dependency
# zisk-sdk = "1.3.0-alpha"
# Local development
# zisk-sdk = { path = "../../../zisk/sdk" }
